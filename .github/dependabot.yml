version: 2

updates:
  - package-ecosystem: cargo
    directories:
      - /crates
      - /crates/y-sweet-worker
      - /releaser
    schedule:
      interval: weekly
    ignore:
      # yrs-kvstore 0.3 (our storage layer) requires yrs ^0.19, so moving past
      # 0.19 needs a migration, not a bump. Dependabot treats 0.x minor bumps as
      # major, so ignore both; 0.19.x patches still come through.
      - dependency-name: yrs
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
    groups:
      cargo-minor-patch:
        update-types: [minor, patch]

  - package-ecosystem: npm
    directories:
      # Root workspace covers js-pkg/{client,react,sdk,gen-docs}, examples, debugger, tests.
      - /
      - /crates/y-sweet-worker
      - /js-pkg/server
      - /local-first-landscape
      - /openapi
    schedule:
      interval: weekly
    groups:
      npm-minor-patch:
        update-types: [minor, patch]

  - package-ecosystem: uv
    directory: /python
    schedule:
      interval: weekly
    groups:
      python-minor-patch:
        update-types: [minor, patch]

  - package-ecosystem: docker
    directories:
      - /crates
      - /examples/nextjs
      - /.github/workflows
    schedule:
      interval: weekly

  - package-ecosystem: docker-compose
    directory: /deploy
    schedule:
      interval: weekly

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      github-actions:
        patterns: ["*"]
