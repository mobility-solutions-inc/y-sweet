name: Rustfmt

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  check-rust-format:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./crates
    steps:
      - uses: actions/checkout@v4
      - name: Install rustfmt
        run: rustup update && rustup component add rustfmt
      - name: Check format
        run: cargo fmt -- --check
      - name: Check format
        run: cargo fmt -- --check
        working-directory: ./crates/y-sweet-worker
