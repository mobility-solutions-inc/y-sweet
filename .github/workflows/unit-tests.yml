name: Unit Tests

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

env:
  CARGO_TERM_COLOR: always

jobs:
  unit-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./crates

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 18
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: "true"
          workspaces: |
            crates
      - name: Run unit tests
        run: cargo test --verbose
